name: Hello GitHub Actions
on:
  workflow_dispatch:
jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Print message
        run: echo "Aadhya!"
      - name: Show date
        run: date
      - name: Show operating sygit add.stem
        run: uname -a

   build:
    name: Build Job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Build application
        run: echo "Building application..."
      - name: Build completed
        run: echo "Build successful!"
  test:
    name: Test Job
    runs-on: ubuntu-latest
    steps:
      - name: Test 1
        run: echo "Running test 1"
      - name: Test 2
        run: echo "Running test 2"
      - name: Tests completed
        run: echo "All tests passed!"

  secrets-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "Secret is available."
          else
            echo "Secret is not configured."
            exit 1
          fi
